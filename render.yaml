services:
  # Backend API Web Service
  - type: web
    name: kumor-para-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build:server
    startCommand: npm run start:server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: OTP_PROVIDER
        value: real
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CORS_ORIGIN_CUSTOMER
        value: https://kumorpara.onrender.com
      - key: CORS_ORIGIN_SELLER
        value: https://kumorpara-sellerstudio.onrender.com
      - key: CORS_ORIGIN_ADMIN
        value: https://kumorpara-admin.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # Customer Marketplace Frontend Static Site
  - type: static
    name: kumorpara-customer
    plan: free
    region: singapore
    buildCommand: npm --workspace=@kumorpara/customer run build
    staticPublishPath: ./apps/customer/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://kumor-para-api.onrender.com/api
      - key: VITE_SELLER_URL
        value: https://kumorpara-sellerstudio.onrender.com

  # Seller Studio Frontend Static Site
  - type: static
    name: kumorpara-seller
    plan: free
    region: singapore
    buildCommand: npm --workspace=@kumorpara/seller run build
    staticPublishPath: ./apps/seller/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://kumor-para-api.onrender.com/api
      - key: VITE_CUSTOMER_URL
        value: https://kumorpara.onrender.com

  # Admin Console Frontend Static Site
  - type: static
    name: kumorpara-admin
    plan: free
    region: singapore
    buildCommand: npm --workspace=@kumorpara/admin run build
    staticPublishPath: ./apps/admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://kumor-para-api.onrender.com/api
      - key: VITE_CUSTOMER_URL
        value: https://kumorpara.onrender.com
      - key: VITE_SELLER_URL
        value: https://kumorpara-sellerstudio.onrender.com
